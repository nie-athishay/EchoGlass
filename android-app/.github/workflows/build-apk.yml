name: Build Signed EchoGlass Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias echoglass \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass echoglass -keypass echoglass \
            -dname "CN=EchoGlass, OU=App, O=EchoGlass, L=Local, S=State, C=US"

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: echoglass
          KEY_ALIAS: echoglass
          KEY_PASSWORD: echoglass
        run: gradle assembleRelease

      - name: Upload Signed EchoGlass APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoGlass-release-apk
          path: app/build/outputs/apk/release/app-release.apk
